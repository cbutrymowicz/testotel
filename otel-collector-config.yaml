# OpenTelemetry Collector Configuration
# This configuration receives telemetry via OTLP and outputs it to the console

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  # Console exporter for debugging - outputs all telemetry to stdout
  logging:
    loglevel: debug
    sampling_initial: 5
    sampling_thereafter: 1

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
